[package]
name = "kai-core"
version = "0.1.0"
edition = "2021"
description = "KAI — Universal AI Input Layer (Core Engine)"
authors = ["KAI Project"]

[[bin]]
name = "kai"
path = "src/main.rs"

[dependencies]
# Async runtime
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

# Direct Win32 keyboard hook (WH_KEYBOARD_LL) — no admin required
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_Security_Credentials",
] }

# Text injection (keyboard simulation)
enigo = "0.2"

# Clipboard access (for large text paste strategy)
arboard = "3"

# HTTP client for AI APIs (with streaming)
reqwest = { version = "0.12", features = ["json", "stream"] }

# JSON serialization/deserialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# TOML config file parsing
toml = "0.8"

# YAML triggers file parsing
serde_yaml = "0.9"

# Async traits
async-trait = "0.1"

# Futures utilities for SSE streaming
futures-util = "0.3"

# Logging
log = "0.4"
env_logger = "0.11"

# Error handling
anyhow = "1"
thiserror = "1"

# Directory paths (AppData, home dir, etc.)
dirs = "5"

# Windows system-tray controls; kept behind the tray adapter module.
tray-icon = "0.25.1"
rpassword = "7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
