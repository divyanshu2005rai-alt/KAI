# KAI Configuration
# Universal AI Input Layer
# ========================

[general]
# The prefix that activates KAI. Type this prefix anywhere to start a trigger.
trigger_prefix = "@@"

# How to terminate a prompt. Press ALT to send.
terminator = "alt"

# Maximum seconds to wait for an AI response.
timeout_seconds = 30

# Maximum prompt characters accepted before dispatch.
max_prompt_chars = 12000

# Recent user/assistant turns retained in memory.
context_turns = 10

# Copy selected text into the AI request. Disabled by default for privacy.
include_selected_text = false

# Request streamed output when supported. KAI injects only the final response.
stream_responses = false

[providers]
# Provider selection: "auto", "groq", "gemini", or "openai-compatible".
# The compatible option is intended for future Qwen, Ollama, and LM Studio use.
active_provider = "auto"

[providers.gemini]
# api_key = "your-gemini-key-here"
default_model = "gemini-2.5-flash"

[routing]
# Strategy: "auto", "cloud", or "local".
strategy = "auto"
# Prefer [providers.openai_compatible] in auto mode.
local_first = false
# Try another configured route after a provider failure.
fallback = true

# Example future/local provider (disabled until active_provider is changed):
# [providers.openai_compatible]
# env_key = "QWEN_API_KEY"
# base_url = "https://your-compatible-endpoint/v1"
# default_model = "your-model-name"

[injection]
# Text longer than this many characters uses clipboard paste (faster).
# Text shorter than this uses simulated keystrokes (safer for all apps).
clipboard_threshold = 200

# Delay between backspace keystrokes when erasing trigger text (milliseconds).
backspace_delay_ms = 5
